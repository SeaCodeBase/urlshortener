<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{.Title}}</title>
</head>
<body style="margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F4F6FA;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#3B4757;">
<main style="box-sizing:border-box;background:#FFFFFF;border-radius:8px;box-shadow:0 1px 3px rgba(3,31,57,0.12);padding:40px 32px;margin:16px;max-width:440px;width:100%;text-align:center;">
<h1 style="margin:0 0 12px;font-size:24px;line-height:1.3;color:#031F39;">{{.Title}}</h1>
<p style="margin:0 0 24px;font-size:16px;line-height:1.5;">{{.Message}}</p>
<a href="{{.HomeURL}}" style="color:#2A5BD7;font-weight:600;text-decoration:none;">Go to homepage</a>
</main>
</body>
</html>
