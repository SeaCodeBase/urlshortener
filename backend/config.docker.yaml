# Docker configuration for URL Shortener

server:
  redirect_port: "8080"  # Port for redirect server (public)
  api_port: "8081"       # Port for API server (frontend calls)
  allow_registration: true  # Set to false to disable new user signups
  allow_origins:         # CORS allowed origins (supports wildcards like *.example.com)
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"

database:
  host: "mariadb"
  port: "3306"
  user: "urlshortener"
  password: "urlshortener_pass"
  name: "urlshortener"
  migrations_path: "migrations"  # directory of NNN_*.sql files applied on startup

redis:
  host: "redis"
  port: "6379"
  password: ""

jwt:
  secret: "dev-jwt-secret-change-in-production"

webauthn:
  rp_id: "localhost"
  rp_origin: "http://localhost:3000"

urls:
  base_url: "http://localhost:8080"       # Public URL of the redirect server (short links)
  frontend_url: "http://localhost:3000"   # Public URL of the web UI (links back to the app)
  redirect_host: ""   # Hostname custom domains CNAME to (default: host of base_url)
  redirect_ip: ""     # IP for custom apex domain A records (empty = not shown)

geoip:
  path: "/app/data/GeoLite2-City.mmdb"

ui:
  # Show link favicons via Google's favicon service; set false for offline installs
  favicon_service: true

uploads:
  # Directory for user-uploaded files (QR logos, page images, ...)
  path: "/app/data/uploads"
