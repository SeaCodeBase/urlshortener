# Docker configuration for URL Shortener
# Mounted read-only at /app/config.yaml by docker-compose.yml

server:
  redirect_port: "8080"  # Port for redirect server (public)
  api_port: "8081"       # Port for API server (frontend calls)
  allow_registration: true  # Set to false to disable new user signups
  allow_origins:         # CORS allowed origins (supports wildcards like *.example.com)
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"

database:
  host: "mariadb"                # MariaDB service name in docker-compose
  port: "3306"                   # MariaDB port
  user: "urlshortener"           # Must match MYSQL_USER in docker-compose.yml
  password: "urlshortener_pass"  # Must match DB_PASSWORD in .env
  name: "urlshortener"           # Must match MYSQL_DATABASE in docker-compose.yml
  migrations_path: "migrations"  # Directory of NNN_*.sql files applied on startup (copied into the image)

redis:
  host: "redis"   # Redis service name in docker-compose
  port: "6379"    # Redis port
  password: ""    # Redis password (empty = no auth)

jwt:
  secret: "dev-jwt-secret-change-in-production"  # REQUIRED - signing key for session JWTs; change it

webauthn:
  rp_id: "localhost"                  # Passkey relying-party ID (the UI's hostname, no scheme/port)
  rp_origin: "http://localhost:3000"  # Exact origin the UI is served from

urls:
  base_url: "http://localhost:8080"       # Public URL of the redirect server (short links)
  frontend_url: "http://localhost:3000"   # Public URL of the web UI (links back to the app)
  redirect_host: "localhost"  # Hostname custom domains CNAME to (default: host of base_url)
  redirect_ip: ""             # IP for custom apex domain A records (empty = not shown)

geoip:
  path: "/app/data/GeoLite2-City.mmdb"  # MaxMind GeoIP2 City database (empty = GeoIP disabled)

ui:
  favicon_service: true  # Show link favicons via Google's favicon service; false for offline installs

uploads:
  path: "/app/uploads"  # Directory for user-uploaded files; backed by the writable "uploads" volume
