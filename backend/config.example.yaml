# URL Shortener Configuration
# Copy this file to config.yaml and update values

server:
  redirect_port: "8080"  # Port for redirect server (public)
  api_port: "8081"       # Port for API server (frontend calls)
  allow_registration: true  # Set to false to disable new user signups
  allow_origins:         # CORS allowed origins (supports wildcards like *.example.com)
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"

database:
  host: "localhost"              # MariaDB/MySQL host
  port: "3306"                   # MariaDB/MySQL port
  user: "urlshortener"           # Database user
  password: ""                   # Database password
  name: "urlshortener"           # Database name
  migrations_path: "migrations"  # Directory of NNN_*.sql files applied on startup

redis:
  host: "localhost"  # Redis host
  port: "6379"       # Redis port
  password: ""       # Redis password (empty = no auth)

jwt:
  secret: "" # REQUIRED - generate a secure random string (signs session JWTs)

webauthn:
  rp_id: "localhost"                  # Passkey relying-party ID (the UI's hostname, no scheme/port)
  rp_origin: "http://localhost:3000"  # Exact origin the UI is served from

urls:
  base_url: "http://localhost:8080"       # Public URL of the redirect server (short links)
  frontend_url: "http://localhost:3000"   # Public URL of the web UI (links back to the app)
  redirect_host: ""   # Hostname custom domains CNAME to (default: host of base_url)
  redirect_ip: ""     # IP for custom apex domain A records (empty = not shown)

geoip:
  # Path to MaxMind GeoIP2 City database (.mmdb file)
  # Download from: https://www.maxmind.com/en/geoip2-databases
  # Leave empty to disable GeoIP lookups
  path: ""

ui:
  favicon_service: true  # Show link favicons via Google's favicon service; false for offline installs

uploads:
  path: "data/uploads"  # Directory for user-uploaded files (QR logos, page images, ...); must be writable

workers:
  webhooks:
    poll_every: 2s    # How often due webhook deliveries are sent
  bulk:
    poll_every: 5s    # How often queued bulk uploads are picked up
    batch_size: 50    # Rows processed between progress updates
