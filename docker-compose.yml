# docker-compose.yml
services:
  backend:
    build: ./backend
    ports:
      - "0.0.0.0:8080:8080"  # Redirect server
      - "0.0.0.0:8081:8081"  # API server
    volumes:
      - ./backend/config.docker.yaml:/app/config.yaml:ro
      - ./backend/data:/app/data:ro      # GeoIP database (read-only)
      - uploads:/app/uploads              # uploads.path (writable, owned by appuser)
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      - BACKEND_URL=http://backend:8081
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  mariadb:
    image: mariadb:10.11
    volumes:
      # Only the baseline schema is loaded on first boot; the backend applies
      # 002+ itself at startup and records them in schema_migrations.
      - ./backend/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=urlshortener
      - MYSQL_USER=urlshortener
      - MYSQL_PASSWORD=${DB_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  uploads:
